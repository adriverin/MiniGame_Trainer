      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minigametrainer.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: CA4ZH8R7Y7

  MiniGameTrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiniGameTrainerTests
    dependencies:
      - target: MiniGameTrainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minigametrainer.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MiniGameTrainer:
    build:
      targets:
        MiniGameTrainer: all
        MiniGameTrainerTests: [test]
    run:
      config: Debug
      storeKitConfiguration: MiniGameTrainer/Resources/Monetization.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MiniGameTrainerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
