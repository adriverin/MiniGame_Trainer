name: MiniGameTrainer
options:
  bundleIdPrefix: com.minigametrainer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  MiniGameTrainer:
    type: application
    platform: iOS
    sources:
      - path: MiniGameTrainer
    info:
      path: MiniGameTrainer/Resources/Info.plist
      properties:
        CFBundleDisplayName: MiniGame Trainer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minigametrainer.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  MiniGameTrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiniGameTrainerTests
    dependencies:
      - target: MiniGameTrainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minigametrainer.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MiniGameTrainer:
    build:
      targets:
        MiniGameTrainer: all
        MiniGameTrainerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MiniGameTrainerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
